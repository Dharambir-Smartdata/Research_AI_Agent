{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin Login — VEDORA UPSC Test Series</title>
  
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('vedora_theme') || localStorage.getItem('omni_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            canvas: { dark: '#0e0f12', darker: '#090a0d', light: '#ffffff' },
            surface: { dark: '#16181d', light: '#f3f4f6' }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-canvas-light dark:bg-canvas-dark text-gray-900 dark:text-gray-100 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500/30">

  <div class="max-w-md w-full space-y-6">
    <!-- Brand & Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-600 to-cyan-500 shadow-lg shadow-indigo-500/25 mb-2">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4.5L12 20L20 4.5H15.8L12 13.5L8.2 4.5H4Z" fill="white" />
          <path d="M12 5.5L13.8 9.5L12 11.2L10.2 9.5Z" fill="#38BDF8" />
        </svg>
      </div>
      <h1 class="font-display text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
        Admin Portal Login
      </h1>
      <p class="text-xs text-gray-500 dark:text-gray-400">
        Sign in to manage UPSC PDF Ingestion, Vector Stores &amp; Section MCQ counts
      </p>
    </div>

    <!-- Login Card -->
    <div class="p-8 rounded-3xl bg-white dark:bg-[#16181d] border border-gray-200/90 dark:border-white/[0.08] shadow-xl space-y-5">
      
      {% if error %}
      <div class="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs font-medium flex items-start gap-2.5">
        <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="{% url 'research_ui:ts_admin_login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Admin Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
            <input type="text" name="username" required autocomplete="username" placeholder="Enter admin username" class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-white/[0.04] border border-gray-200 dark:border-white/[0.08] text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500 font-sans transition-colors" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Admin Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </span>
            <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-white/[0.04] border border-gray-200 dark:border-white/[0.08] text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500 font-sans transition-colors" />
          </div>
        </div>

        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold shadow-md shadow-indigo-500/25 transition-all cursor-pointer">
          Sign In to Admin Panel &rarr;
        </button>
      </form>

      <div class="pt-2 text-center">
        <a href="{% url 'research_ui:test_series' %}" class="text-xs text-gray-500 hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors">
          &larr; Return to Candidate Test Portal
        </a>
      </div>

    </div>
  </div>

</body>
</html>
